name: Sito Armor (prezzi live e app per telefono)
on:
  schedule:
    - cron: '*/15 7-21 * * 1-5'   # ogni 15 minuti dalle 8-9 alle 22-23 ora italiana, nei giorni feriali
    - cron: '5,35 22 * * 1-5'      # dopo le 23 italiane: prende la chiusura serale (Lang & Schwarz chiude alle 23)
    - cron: '15 6,12 * * 0,6'      # nel weekend due volte al giorno
  workflow_run:   # il sito si ricostruisce subito dopo ogni aggiornamento dei dati
    workflows: ["Aggiornamento giornaliero Armor", "Notizie e analisi Armor", "Ricerca modello Armor", "Convalida mensile Armor", "Agenda del mattino Armor", "Mercati Armor", "Motore titoli Armor", "Opportunita Armor", "Economia Armor", "Grandi fondi (dati SEC)"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  sito:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt tzdata
      - name: Prezzi live
        env:
          PYTHONPATH: src
        run: python -m armor live
      - name: Previsione del VWCE a 1, 3, 6, 12 ore
        continue-on-error: true
        timeout-minutes: 5
        env:
          PYTHONPATH: src
        run: python -m armor ore
      - name: Perché si muove oggi (settori, aziende, notizie)
        continue-on-error: true
        timeout-minutes: 5
        env:
          PYTHONPATH: src
        run: python -m armor perche
      - name: Costruisci il sito
        env:
          PYTHONPATH: src
        run: python -m armor sito
      # Controllo prima di spedire: se il sito e' vuoto o manca la pagina principale, meglio fermarsi
      # qui con un messaggio chiaro che far fallire il deploy con «0 artifact» senza spiegazione.
      - name: Controlla che il sito ci sia
        run: |
          test -f site/index.html || { echo "::error::site/index.html non esiste: la costruzione non ha prodotto il sito"; exit 1; }
          n=$(find site -type f | wc -l)
          kb=$(du -sk site | cut -f1)
          echo "sito pronto: $n file, ${kb} KB"
          test "$n" -ge 10 || { echo "::error::solo $n file nel sito: costruzione incompleta"; exit 1; }
          test "$kb" -ge 200 || { echo "::error::sito di soli ${kb} KB: costruzione incompleta"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # Il deploy di GitHub Pages ogni tanto non trova il pacchetto appena caricato («Found 0 artifact(s)»):
      # e' un intoppo temporaneo della piattaforma, che GitHub stessa invita a riprovare. Si riprova una volta.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Aspetta prima di riprovare
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "::warning::primo tentativo di pubblicazione fallito, riprovo fra 60 secondi"
          sleep 60
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Esito della pubblicazione
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then echo "pubblicato al primo tentativo"
          elif [ "${{ steps.deploy2.outcome }}" = "success" ]; then echo "pubblicato al secondo tentativo"
          else echo "::error::pubblicazione non riuscita due volte: controllare githubstatus.com"; exit 1; fi
