name: Sito Armor (prezzi live e app per telefono)
on:
  schedule:
    - cron: '*/15 7-21 * * 1-5'   # ogni 15 minuti dalle 8-9 alle 22-23 ora italiana, nei giorni feriali
    - cron: '5,35 22 * * 1-5'      # dopo le 23 italiane: prende la chiusura serale (Lang & Schwarz chiude alle 23)
    - cron: '15 6,12 * * 0,6'      # nel weekend due volte al giorno
  workflow_run:   # il sito si ricostruisce subito dopo ogni aggiornamento dei dati
    workflows: ["Aggiornamento giornaliero Armor", "Notizie e analisi Armor", "Ricerca modello Armor", "Convalida mensile Armor", "Agenda del mattino Armor"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  sito:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt tzdata
      - name: Prezzi live
        env:
          PYTHONPATH: src
        run: python -m armor live
      - name: Costruisci il sito
        env:
          PYTHONPATH: src
        run: python -m armor sito
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
