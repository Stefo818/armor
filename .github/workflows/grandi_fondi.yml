name: Grandi fondi (dati SEC)
on:
  schedule:
    - cron: '30 5 * * 6'
  workflow_dispatch:
    inputs:
      solo_sonda:
        description: 'Solo prova di accesso (non scarica la storia)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: armor-dati
  cancel-in-progress: false
jobs:
  sec:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      PYTHONUNBUFFERED: '1'
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt tzdata
      - name: Prova di accesso ai dati SEC
        continue-on-error: true
        run: python -m armor sec-sonda
      - name: Scarica e calcola (a pezzi)
        if: ${{ !inputs.solo_sonda }}
        continue-on-error: true
        run: python -m armor sec-aggiorna 12
      - name: Salva i dati nel repository
        run: bash scripts/salva.sh "Grandi fondi: dati SEC" data
