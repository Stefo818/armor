name: Accumulo dati per le ricerche future
on:
  schedule:
    - cron: '50 22 * * 1-5'   # dopo la chiusura di Wall Street: chiusure, barre a 5 minuti, opzioni, componenti dell'S&P 500
    - cron: '50 6 * * 2-6'    # mattina: Asia, futures e criptovalute della notte
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: armor-dati
  cancel-in-progress: false
jobs:
  accumulo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt tzdata
      - name: Accumula i dati
        env:
          PYTHONPATH: src
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        timeout-minutes: 45
        run: python -m armor accumulo
      - name: Salva nel repository
        if: always()
        run: bash scripts/salva.sh "Accumulo dati per le ricerche future" data/series data/ohlc data/intraday data/componenti data/opzioni_ext data/cot data/aste data/finra_short data/vix_futures data/previsioni data/dealer data/ftd data/short_interest data/etf_quote data/sec_moduli data/testi data/retail data/accumulo_stato.json
