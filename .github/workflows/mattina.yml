name: Agenda del mattino Armor
on:
  schedule:
    - cron: '50 6 * * 1-5'   # circa le 8 in Italia
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  mattina:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt tzdata
      - name: Agenda e bilancio di ieri
        env:
          PYTHONPATH: src
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m armor mattina
      - name: Controllo che il diario cresca (avvisa anche se il workflow serale non è partito)
        continue-on-error: true
        env:
          PYTHONPATH: src
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m armor diagnostica
