name: Opportunita Armor
on:
  schedule:
    - cron: '30 5 * * 6'   # sabato mattina (ora UTC): selezione settimanale
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: armor-dati
  cancel-in-progress: false
jobs:
  opportunita:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: data/_cache
          key: titoli-cache-${{ github.run_id }}
          restore-keys: titoli-cache-
      - run: pip install -r requirements.txt tzdata
      - name: Selezione settimanale delle opportunita
        env:
          PYTHONPATH: src
        run: python -m armor opportunita-aggiorna
      - name: Salva i risultati nel repository
        run: bash scripts/salva.sh "Opportunita - selezione settimanale" data/opportunita.json data/opportunita_registro.csv data/opportunita_ricostruito.csv data/opportunita_registro_fattori.csv data/opportunita_ricostruito_fattori.csv data/protocollo_opportunita_log.csv data/opportunita_ombra_v1.csv data/opportunita_ombra_v2.csv data/opportunita_ombra_v1_fattori.csv data/opportunita_ombra_v2_fattori.csv data/opportunita_adozione.json
