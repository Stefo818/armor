name: Notizie e analisi Armor
on:
  schedule:
    - cron: '5 6,10,14,18 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: armor-dati
  cancel-in-progress: false
jobs:
  notizie:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-v1
      - run: pip install -r requirements.txt tzdata
      - name: FinBERT (facoltativo: se non si installa, si usa il vocabolario)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install transformers || echo "FinBERT non installato"
      - name: Notizie e analisi
        env:
          PYTHONPATH: src
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m armor notizie
      - name: Salva i dati nel repository
        run: bash scripts/salva.sh "Notizie e analisi automatiche" data/news data/reports data/registry data/calendar.json data/holdings.json data/alerts_state.json
