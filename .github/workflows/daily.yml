name: Aggiornamento giornaliero Armor
on:
  schedule:
    - cron: '30 23 * * 1-5'   # dopo la chiusura di Wall Street (ora UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt tzdata
      - name: Aggiorna dati, previsioni e diario
        env:
          PYTHONPATH: src
        run: python -m armor tutto
      - name: Salva i dati nel repository
        run: |
          git config user.name "armor-bot"
          git config user.email "armor-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Aggiornamento automatico dati" && git pull --rebase && git push)
