name: Aggiornamento giornaliero Armor
on:
  schedule:
    - cron: '30 23 * * 1-5'   # dopo la chiusura di Wall Street (ora UTC)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: armor-dati
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt tzdata
      - name: Aggiorna dati, previsioni e diario
        env:
          PYTHONPATH: src
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        timeout-minutes: 20
        run: python -m armor tutto
      - name: Salva i dati nel repository
        if: always()
        run: bash scripts/salva.sh "Aggiornamento automatico dati" data
