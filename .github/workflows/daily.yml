name: Aggiornamento giornaliero Armor
on:
  schedule:
    - cron: '30 23 * * 1-5'   # dopo la chiusura di Wall Street (ora UTC)
    - cron: '40 4 * * 2-6'    # di riserva al mattino (se il giro della sera è saltato o FRED ha pubblicato dati nella notte)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: armor-dati
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt tzdata
      - name: Aggiorna dati, previsioni e diario
        env:
          PYTHONPATH: src
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 20
        run: python -m armor tutto
      - name: Controlli prima di salvare (file chiave leggibili, diario integro)
        id: controlli
        if: always()
        env:
          PYTHONPATH: src
        run: python -m armor controlli
      - name: Salva i dati nel repository
        if: always() && steps.controlli.outcome != 'failure'
        run: bash scripts/salva.sh "Aggiornamento automatico dati" data
