name: Aggiornamento giornaliero Armor
on:
  schedule:
    - cron: '30 23 * * 1-5'   # dopo la chiusura di Wall Street (ora UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt tzdata
      - name: Aggiorna dati, previsioni e diario
        env:
          PYTHONPATH: src
        run: python -m armor tutto
      - name: Salva i dati nel repository
        run: |
          git config user.name "armor-bot"
          git config user.email "armor-bot@users.noreply.github.com"
          git config merge.ours.driver true
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Aggiornamento automatico dati"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 8
          done
          exit 1
