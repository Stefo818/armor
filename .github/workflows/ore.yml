name: Avviso ribasso Armor (previsione a ore)
on:
  schedule:
    - cron: '*/15 5-22 * * 1-5'   # ogni 15 minuti dalle 6-7 alle 23-24 ora italiana (copre la sera americana e le notti dei futures)
    - cron: '*/15 22-23 * * 0'    # domenica sera: i futures riaprono e anticipano il salto di lunedì
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: armor-ore
  cancel-in-progress: true
jobs:
  ore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt tzdata
      - name: Prezzi live del VWCE
        env:
          PYTHONPATH: src
        run: python -m armor live
      - name: Previsione a 1, 3, 6, 12 ore e avvisi di ribasso
        env:
          PYTHONPATH: src
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m armor ore --avvisi
      - name: Salva stato e diario (il file dei risultati lo ricostruisce il sito ogni 15 minuti)
        run: bash scripts/salva.sh "Previsione a ore" data/ore_state.json data/ore_diario.csv
