name: Convalida mensile Armor
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: armor-dati
  cancel-in-progress: false
jobs:
  valida:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt tzdata
      - env:
          PYTHONPATH: src
        run: |
          python -m armor valida
          python -m armor migliora
      - name: Salva i dati nel repository
        run: bash scripts/salva.sh "Convalida mensile" data
