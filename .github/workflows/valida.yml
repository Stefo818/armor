name: Convalida mensile Armor
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: armor-dati
  cancel-in-progress: false
jobs:
  valida:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt tzdata
      - env:
          PYTHONPATH: src
        run: |
          python -m armor valida
          python -m armor migliora
      - name: Previsioni storiche di Titan (grafico di confronto)
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m armor titan-storia
      - name: Prove dell'Indice Occasione, delle fasce e della salute
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m armor occasione-verifica
      - name: Valutazione dei modelli (A1 contro FHS)
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m armor valuta-modelli
      - name: Taratura dei modelli (protocollo di taratura)
        continue-on-error: true
        timeout-minutes: 90
        env:
          PYTHONPATH: src
        run: python -m armor taratura
      - name: Minimi e lungo periodo (storia e prove, protocollo PROTOCOLLO_MINIMI.md)
        continue-on-error: true
        timeout-minutes: 60
        env:
          PYTHONPATH: src
        run: python -m armor minimi-storia
      - name: Salva i dati nel repository
        run: bash scripts/salva.sh "Convalida mensile" data
