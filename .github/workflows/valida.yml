name: Convalida mensile Armor
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  valida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt tzdata
      - env:
          PYTHONPATH: src
        run: |
          python -m armor valida
          python -m armor sfide
      - run: |
          git config user.name "armor-bot"
          git config user.email "armor-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Convalida mensile" && git pull --rebase && git push)
